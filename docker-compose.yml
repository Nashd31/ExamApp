version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: examapp_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: examapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: examapp_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/examapp
      - JWT_SECRET=docker_compose_jwt_secret_key_12345
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: examapp_client
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
